<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WISS Togetherに参加</title><link rel="stylesheet" href="style.css"></head><body><header><h1>WISS Together</h1></header><main><section class="card"><h2>役割を選んで参加</h2><p>アプリのインストールは不要です。QRを表示したアプリ端末は被写体として参加しています。</p><label>参加コード<input id="code" autocomplete="off" autocapitalize="characters"></label><button id="photographer">撮影者として参加</button><button id="subject" class="secondary">被写体として参加</button><p>撮影者は1人、被写体はアプリ端末を含め最大6人です。撮影者はカメラ、被写体は映像・フレーム・写真を確認できます。</p><p id="error" class="error" role="alert"></p><a href="subject.html">参加済みの被写体として再接続</a></section></main><script type="module" src="join.js"></script></body></html>
