<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WISS 撮影者</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>WISS / 協調フォトブース</h1><span>撮影者</span></header><main>
<p id="error" class="error" role="alert"></p><section id="start" class="card"><h2>ふたりで一枚をつくる</h2><p>被写体1人が同じフレームを見ながらポーズを合わせます。</p><p>親機アプリに表示された撮影者用コードを入力してください。</p><label>撮影者用コード<input id="photographerCode" autocomplete="off"></label><button id="join">撮影者として参加</button></section>
<div id="session" class="layout" hidden><section><div class="card"><div class="row"><h2 id="mode">自由撮影</h2><span id="connection" class="pill">接続中</span></div><div class="frame"><video id="video" autoplay muted playsinline></video><img id="overlay" class="overlay" alt="確定フレーム" hidden></div><div class="row"><button id="camera">カメラを開始</button><button id="capture" disabled>撮影する</button><button id="free" class="secondary">ガイドを非表示</button></div><fieldset><legend>ガイド調整</legend><label>横位置<input id="guide-x" type="range" min="-1" max="1" step="0.01" value="0"></label><label>縦位置<input id="guide-y" type="range" min="-1" max="1" step="0.01" value="0"></label><label>大きさ<input id="guide-scale" type="range" min="0.25" max="3" step="0.01" value="1"></label><label>濃さ（0で非表示）<input id="guide-opacity" type="range" min="0" max="1" step="0.01" value="0.65"></label></fieldset><p class="muted">縦3:4・中央クロップ。フレームは写真には焼き込みません。</p></div><section class="card"><h2>撮影した写真</h2><p>端末保存とWISS公式アルバムへの共有は別操作です。撮影者の保存だけで公式共有は始まりません。</p><div id="photos" class="grid"></div></section></section>
<aside><section class="card"><h2>被写体の接続</h2><div id="subjects" class="status"></div><p>被写体アプリで参照写真とガイドを選んでください。ガイドの位置・大きさ・濃さは双方で調整できます。</p></section><button id="end" class="danger">参加画面に戻る</button></aside></div>
<dialog id="review"><h2>撮影結果を確認</h2><img id="reviewImage" class="thumb" alt="撮影結果"><p id="consentSummary"></p><button id="save">写真を確定・被写体へ渡す</button><button id="delete" class="danger">削除する</button><p id="reviewError" class="error" role="alert"></p></dialog>
</main><script type="module" src="photographer.js"></script></body></html>
