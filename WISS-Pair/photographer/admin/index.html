<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WISS運営</title><link rel="stylesheet" href="../booth/style.css"></head>
<body><header><h1>WISS Challenge 運営</h1></header><main><p id="error" class="error" role="alert"></p>
<section id="login" class="card"><h2>運営認証</h2><label>運営用アクセス資格<input id="operatorToken" type="password" autocomplete="current-password"></label><button id="loginButton">ログイン</button></section>
<div id="dashboard" hidden><section class="card"><h2>Immich連携状況</h2><p id="readiness"></p><p id="counts"></p><p id="storage"></p><div class="row"><button id="pauseButton">共有を一時停止</button><button id="refreshButton" class="secondary">更新</button></div></section>
<section class="card"><h2>要確認・再試行</h2><div id="jobs" class="status"></div></section>
<section class="card"><h2>運用注意</h2><p>設定変更はバックエンドの環境設定へ反映し、再起動してください。結果確認中の写真はImmich側のアルバムを確認してから再試行してください。</p></section></div></main><script type="module" src="admin.js"></script></body></html>
